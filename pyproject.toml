[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fitslip"
version = "0.1.0"
description = "A number against a limit. Readings use the median and the sample standard deviation."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
fitslip = "fitslip.__main__:main"
